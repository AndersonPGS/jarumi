name: Windows build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/release-manifest.js --verify
      - run: npm ci
      - run: npm run dist:win
      - run: node scripts/release-manifest.js
      - uses: actions/upload-artifact@v4
        with:
          name: jarumi-windows-unsigned
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          retention-days: 14
      - name: Publish tested Windows downloads
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content package.json | ConvertFrom-Json).version
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --title "Jarumi $releaseVersion" --notes-file "docs/releases/v$releaseVersion.md" "dist/Jarumi-$releaseVersion-Setup-x64.exe" "dist/Jarumi-$releaseVersion-Portable-x64.exe" "dist/SHA256SUMS.txt"
